<meta charset="utf-8">
<title>Турбо сметчик мобильный</title>
<style>
:root{
  --desk:#C9CFD6; --win:#F0F0F0; --win2:#E4E4E4; --win3:#CFD3D8;
  --sheet:#FFFFFF; --grid:#D2D2D2; --grid2:#E7E7E7; --edge:#9AA0A6;
  --txt:#0E0E0E; --txt2:#3D3D3D; --txt3:#767676;
  --blue:#2A5DB0; --blue-d:#1F4E96; --sel:#316AC5; --selsoft:#CFE0F5;
  --band:#DFE8D4; --band2:#EDF2E6; --band3:#D3DFC4;
  --warn:#9A5B0C; --warnbg:#FBEED6; --ok:#1E6B45; --okbg:#DFEDE5; --crit:#A32B22;
  --f:-apple-system,'Segoe UI',Roboto,Tahoma,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0; background:var(--desk); color:var(--txt); font-family:var(--f);
  font-size:16px; -webkit-font-smoothing:antialiased; overflow:hidden}
button{font:inherit; color:inherit; cursor:pointer; font-family:var(--f)}
input{font-family:var(--f)}
:focus-visible{outline:2px solid var(--sel); outline-offset:-2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

.stage{height:100svh; display:grid; place-items:center; padding:14px}
.phone{width:394px; height:min(852px, calc(100svh - 28px)); background:var(--win3);
  border:1px solid #8C929A; border-radius:34px; padding:8px; display:flex;
  box-shadow:0 2px 6px rgba(20,28,40,.2), 0 34px 64px -30px rgba(20,28,40,.6)}
.scr{flex:1; background:var(--sheet); border-radius:27px; overflow:hidden; display:flex;
  flex-direction:column; position:relative}
@media (max-width:520px), (max-height:700px){
  .stage{padding:0}
  .phone{width:100%; height:100svh; border:0; border-radius:0; padding:0; box-shadow:none}
  .scr{border-radius:0}
}

.status-os{display:flex; align-items:center; justify-content:space-between; padding:11px 17px 4px;
  background:var(--win); font-size:10px; color:var(--txt3); flex:none; font-variant-numeric:tabular-nums}
.offline{display:inline-flex; align-items:center; gap:4px; color:var(--warn); background:var(--warnbg);
  border:1px solid #E4CFA4; border-radius:2px; padding:1px 6px; font-size:9px}
.offline i{width:5px; height:5px; border-radius:50%; background:var(--warn)}

/* заголовок окна */
.titlebar{display:flex; align-items:center; gap:7px; padding:4px 8px 5px 10px; background:var(--win);
  border-bottom:1px solid var(--win2); flex:none}
.titlebar .ico{width:16px; height:16px; flex:none; border-radius:2px; background:linear-gradient(160deg,#4C87D0,#1F4E96);
  display:grid; place-items:center; color:#fff; font-size:9px; font-weight:700; line-height:1}
.titlebar .tt{flex:1; min-width:0; font-size:11.5px; color:var(--txt2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.titlebar .tt b{color:var(--txt); font-weight:600}

/* строка меню */
.menubar{display:flex; gap:0; padding:0 4px; background:var(--win); border-bottom:1px solid var(--win2);
  overflow-x:auto; scrollbar-width:none; flex:none}
.menubar::-webkit-scrollbar{display:none}
.menubar button{border:0; background:none; padding:5px 9px; font-size:12px; color:var(--txt); white-space:nowrap; border-radius:2px}
.menubar button:active, .menubar button.on{background:var(--sel); color:#fff}

/* панель инструментов */
.toolbar{display:flex; gap:3px; padding:5px 6px; background:var(--win); border-bottom:1px solid var(--edge);
  overflow-x:auto; scrollbar-width:none; flex:none}
.toolbar::-webkit-scrollbar{display:none}
.tbtn{display:flex; align-items:center; gap:4px; white-space:nowrap; border:1px solid transparent;
  background:none; border-radius:3px; padding:5px 8px; font-size:11.5px; color:var(--txt2)}
.tbtn:hover{border-color:#B6BCC4; background:#FAFAFA}
.tbtn:active{background:var(--selsoft); border-color:var(--sel)}
.tbtn:disabled{color:#AEB2B7; cursor:default}
.tbtn:disabled:hover{border-color:transparent; background:none}
.tbtn b{font-weight:600; color:var(--blue-d)}
.tsep{width:1px; background:var(--win2); margin:3px 2px; flex:none}

/* полоса контекста */
.ctx{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 10px;
  background:var(--win2); border-bottom:1px solid var(--grid); font-size:10.5px; color:var(--txt2);
  white-space:nowrap; flex:none}
.ctx .l{overflow:hidden; text-overflow:ellipsis}
.ctx b{color:var(--blue-d)}
.ctx .sum{font-variant-numeric:tabular-nums; font-weight:600; color:var(--blue-d)}

.body{flex:1; overflow:auto; overscroll-behavior:contain; background:var(--sheet); -webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{width:9px; height:9px}
.body::-webkit-scrollbar-track{background:var(--win)}
.body::-webkit-scrollbar-thumb{background:#BFC4CA; border:1px solid var(--win2)}

/* сетка */
.gw{overflow-x:auto}
.gw::-webkit-scrollbar{height:9px}
.gw::-webkit-scrollbar-track{background:var(--win)}
.gw::-webkit-scrollbar-thumb{background:#BFC4CA}
table.g{border-collapse:separate; border-spacing:0; width:100%; font-size:11px;
  font-variant-numeric:tabular-nums; background:var(--sheet)}
table.g th{position:sticky; top:0; z-index:3; background:var(--win); color:var(--txt); font-weight:600;
  font-size:10.5px; text-align:left; padding:4px 5px; border-bottom:1px solid var(--edge);
  border-right:1px solid var(--grid); white-space:nowrap}
table.g td{padding:4px 5px; border-bottom:1px solid var(--grid2); border-right:1px solid var(--grid2);
  vertical-align:top; line-height:1.28; white-space:nowrap; color:var(--txt)}
body.comp table.g td{padding:1px 5px}
table.g .r{text-align:right}
table.g .nm{white-space:normal}
table.g tr.d td{background:var(--sheet)}
table.g tr.d:hover td{background:#F2F6FB}
table.g tr.d.sel td{background:var(--sel); color:#fff}
table.g tr.d.sel td.k{color:#FFE0A8}
table.g tr.d.new td{animation:fl 1.6s ease}
@keyframes fl{0%{background:var(--selsoft)}100%{background:var(--sheet)}}
table.g tr.b1 td{background:var(--blue); color:#fff; font-weight:600; border-bottom:1px solid var(--blue-d)}
table.g tr.b2 td{background:var(--band3); font-weight:600}
table.g tr.b3 td{background:var(--band); font-weight:600}
table.g tr.b4 td{background:var(--band2); font-weight:600}
table.g tr.tot td{background:var(--win2); font-weight:600; border-bottom:1px solid var(--grid)}
table.g .stub{position:sticky; left:0; z-index:2; background:var(--win); border-right:1px solid var(--grid);
  color:var(--txt3); font-size:10px; text-align:right}
table.g tr.d.sel .stub{background:var(--sel); color:#fff}
table.g tr.b1 .stub{background:var(--blue); color:#fff}
table.g tr.b2 .stub{background:var(--band3); color:var(--txt2)}
table.g tr.b3 .stub{background:var(--band); color:var(--txt2)}
table.g tr.b4 .stub{background:var(--band2); color:var(--txt2)}
table.g tr.tot .stub{background:var(--win2)}
table.g .ed{cursor:text}
table.g .ed:hover{outline:1px solid var(--sel); outline-offset:-1px}
table.g input.ce{width:100%; border:1px solid var(--sel); padding:1px 3px; font:inherit; font-size:11px;
  text-align:right; background:#fff; color:var(--txt); font-variant-numeric:tabular-nums}
table.g .k{color:var(--warn)}
.empty{padding:26px 20px; text-align:center; color:var(--txt3); font-size:12px; line-height:1.7}

/* итоги */
.itogi{border-top:1px solid var(--edge); background:var(--win)}
.itogi .ih{display:flex; align-items:center; justify-content:space-between; width:100%; border:0;
  background:var(--win2); padding:4px 10px; font-size:10.5px; font-weight:600; color:var(--txt2);
  border-bottom:1px solid var(--grid)}
.itogi .ib{padding:6px 10px 8px}
.itogi .il{display:flex; justify-content:space-between; gap:12px; font-size:11px; color:var(--txt2);
  padding:1.5px 0; font-variant-numeric:tabular-nums}
.itogi .il b{color:var(--txt); font-weight:600}
.itogi .il.g{border-top:1px solid var(--grid); margin-top:5px; padding-top:6px; font-size:12.5px; color:var(--txt)}
.itogi .il.g b{color:var(--blue-d); font-size:14px}

/* списки и формы */
.grp{padding:9px 12px 4px; background:var(--sheet); font-size:10.5px; font-weight:600; color:var(--txt3);
  display:flex; justify-content:space-between; border-bottom:1px solid var(--grid2)}
.lrow{display:grid; grid-template-columns:1fr auto; gap:1px 10px; width:100%; text-align:left;
  background:var(--sheet); border:0; border-bottom:1px solid var(--grid2); padding:9px 12px}
.lrow:hover{background:#F2F6FB}
.lrow.act{background:var(--selsoft)}
.lrow .t{font-size:12.5px; font-weight:600}
.lrow .a{font-size:10.5px; color:var(--txt3)}
.lrow .s{grid-row:1/3; grid-column:2; align-self:center; text-align:right; font-size:11.5px;
  font-variant-numeric:tabular-nums; white-space:nowrap}
.pad{padding:12px}
.field{margin-bottom:10px}
.field label{display:block; font-size:10.5px; color:var(--txt3); margin-bottom:3px}
.field input{width:100%; padding:7px 8px; border:1px solid var(--edge); background:#fff; color:var(--txt);
  font-size:14px; font-variant-numeric:tabular-nums; border-radius:2px}
.field input.n{text-align:right}
.g3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px}
.g2{display:grid; grid-template-columns:1fr 1fr; gap:7px}
.panel{background:var(--win); border:1px solid var(--grid); padding:8px 10px; margin-bottom:11px}
.panel h4{margin:0 0 6px; font-size:10.5px; color:var(--txt3); font-weight:600}
.panel .cl{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:4px 0;
  border-bottom:1px solid var(--grid2); font-size:12px}
.panel .cl:last-child{border-bottom:0}
.panel .cl b{font-weight:600; font-variant-numeric:tabular-nums}
.panel .cl button{border:1px solid var(--edge); background:var(--win2); padding:3px 8px; font-size:10.5px; border-radius:2px}
.panel .cl button:hover{border-color:var(--sel); color:var(--blue-d)}
.btn{width:100%; border:1px solid var(--edge); background:var(--win2); padding:9px; font-size:12.5px;
  border-radius:2px; display:flex; justify-content:center; align-items:center; gap:8px}
.btn:hover{border-color:var(--sel)}
.btn.pri{background:var(--sel); border-color:var(--blue-d); color:#fff; font-weight:600}
.btn:disabled{opacity:.55; cursor:default}
.bar{height:14px; border:1px solid var(--edge); background:#fff; margin:9px 0 4px; padding:1px}
.bar i{display:block; height:100%; width:0; background:linear-gradient(180deg,#5C9BE0,#2A5DB0); transition:width .25s linear}
.tag{font-size:10px; padding:1px 6px; border:1px solid var(--grid); border-radius:2px; white-space:nowrap}
.tag.w{background:var(--warnbg); color:var(--warn); border-color:#E4CFA4}
.tag.o{background:var(--okbg); color:var(--ok); border-color:#B9D6C6}
.tag.s{background:var(--selsoft); color:var(--blue-d); border-color:#A9C7EA}
.pills{display:flex; gap:5px; flex-wrap:wrap}
.pill{border:1px solid var(--edge); background:var(--win2); padding:6px 10px; font-size:11.5px; border-radius:2px}
.pill.on{border-color:var(--blue-d); background:var(--sel); color:#fff; font-weight:600}
.hint{font-size:11px; color:var(--txt3); line-height:1.55}

/* поиск */
.search{padding:5px 6px; background:var(--win); border-bottom:1px solid var(--grid); flex:none; display:flex; gap:5px}
.search input{flex:1; min-width:0; padding:6px 8px; border:1px solid var(--edge); background:#fff; font-size:12px; border-radius:2px}

/* вкладки каталогов */
.subtabs{display:flex; gap:0; background:var(--win2); border-top:1px solid var(--edge); flex:none;
  overflow-x:auto; scrollbar-width:none; padding:0 4px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{border:1px solid var(--grid); border-bottom:0; background:var(--win); padding:5px 9px;
  font-size:10.5px; white-space:nowrap; color:var(--txt2); margin-top:3px; border-radius:3px 3px 0 0}
.subtabs button.on{background:#fff; font-weight:700; color:var(--blue-d); border-color:var(--edge); margin-top:0; padding-top:8px}

/* статусная строка */
.statusline{display:flex; align-items:center; gap:8px; padding:3px 10px; background:var(--win);
  border-top:1px solid var(--grid); font-size:10px; color:var(--txt3); flex:none; white-space:nowrap}
.statusline .sl{overflow:hidden; text-overflow:ellipsis; flex:1}
.statusline .sr{font-variant-numeric:tabular-nums}

/* нижние вкладки */
.tabbar{display:grid; grid-template-columns:repeat(5,1fr); border-top:1px solid var(--edge);
  background:var(--win); flex:none; padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0 9px;
  border:0; background:none; font-size:9px; color:var(--txt3); position:relative}
.tabbar button svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.tabbar button.on{color:var(--blue-d); background:#fff; box-shadow:inset 0 2px 0 var(--sel)}
.tabbar .dot{position:absolute; top:5px; right:calc(50% - 14px); width:6px; height:6px; border-radius:50%; background:#C4761A}

/* всплывающие окна */
.toast{position:absolute; left:10px; right:10px; bottom:66px; background:#FFFFE1; color:var(--txt);
  border:1px solid #C9B98A; padding:7px 10px; font-size:11px; line-height:1.45;
  box-shadow:0 3px 10px rgba(0,0,0,.22); opacity:0; transform:translateY(5px);
  transition:opacity .16s, transform .16s; pointer-events:none; z-index:20}
.toast.show{opacity:1; transform:none}
.ov{position:absolute; inset:0; background:rgba(20,28,40,.42); display:flex; align-items:flex-end; z-index:30}
.dlg{width:100%; background:var(--win); border-top:1px solid var(--edge); max-height:88%; overflow:auto}
.dlg h3{margin:0; padding:9px 12px; font-size:12.5px; font-weight:600; background:var(--sel); color:#fff}
.dlg .db{padding:12px}
.mrow{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; text-align:left;
  background:var(--win); border:0; padding:9px 12px; font-size:12.5px; border-bottom:1px solid var(--win2)}
.mrow:hover{background:var(--sel); color:#fff}
.mrow:hover .kk, .mrow:hover .sub{color:#D8E6F8}
.mrow .kk{font-size:10.5px; color:var(--txt3)}
.mrow .sub{display:block; font-size:10.5px; color:var(--txt3); margin-top:1px}
.mrow[disabled]{color:#AEB2B7; cursor:default}
.mrow[disabled]:hover{background:var(--win); color:#AEB2B7}
.mrow .ck{width:14px; flex:none; color:var(--blue-d); font-weight:700}
.mrow:hover .ck{color:#fff}
.msep{height:1px; background:var(--grid); margin:3px 0}
.dact{display:flex; gap:7px; padding:10px 12px; border-top:1px solid var(--grid); background:var(--win2)}
.dact button{flex:1; border:1px solid var(--edge); background:var(--win); padding:8px; font-size:12.5px; border-radius:2px}
.dact button.ok{background:var(--sel); border-color:var(--blue-d); color:#fff; font-weight:600}
</style>

<div class="stage"><div class="phone"><div class="scr">
  <div class="status-os"><span>14:32</span><span class="offline"><i></i>ОФЛАЙН · СЕТИ НЕТ</span><span>76 %</span></div>
  <div class="titlebar"><span class="ico">ТС</span><span class="tt" id="tt"></span></div>
  <div class="menubar" id="menubar"></div>
  <div class="toolbar" id="toolbar"></div>
  <div id="ctxbar"></div>
  <div id="searchbar"></div>
  <div class="body" id="body"></div>
  <div id="subtabs"></div>
  <div class="statusline"><span class="sl" id="slL"></span><span class="sr" id="slR"></span></div>
  <div class="toast" id="toast"></div>
  <div class="tabbar" id="tabs">
    <button data-tab="docs"><svg viewBox="0 0 24 24"><path d="M4 5h6l2 2h8v12H4z"/></svg>Сметы</button>
    <button data-tab="smeta" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16"/><path d="M3 9h18M10 9v11M16 9v11"/></svg>Смета</button>
    <button data-tab="cat"><svg viewBox="0 0 24 24"><path d="M4 4h7v16H4zM13 4h7v7h-7zM13 13h7v7h-7z"/></svg>Источники</button>
    <button data-tab="rooms"><svg viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="8"/><path d="M7 8v3M11 8v4M15 8v3M19 8v4"/></svg>Замеры</button>
    <button data-tab="sync"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.6-5.7L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-13.6 5.7L4 16"/><path d="M4 20v-4h4"/></svg>Обмен</button>
  </div>
</div></div></div>

    if(td.querySelector('input')) return;

    if(!it) return;
    selId = it.id;
    var cur = fld === 'qty' ? it.qty : fld === 'k' ? it.k : it.p;
    td.innerHTML = '<input class="ce" type="text" inputmode="decimal" value="' + num(cur) + '">';
    var inp = td.firstChild, done = false;
    inp.focus(); inp.select();
    function commit(){
      if(done) return; done = true;
      var v = pnum(inp.value);
      if(fld === 'qty') it.qty = v; else if(fld === 'k') it.k = v > 0 ? v : 1; else it.p = v;
      touch(); say('Изменено: ' + it.c); render();
    }
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); commit(); }
      else if(e.key === 'Escape'){ done = true; render(); }
    });
  }

        for(si=0;si<p.secs.length;si++){
          s = p.secs[si];
          if(state) collapsed[s.c] = 1; else delete collapsed[s.c];
          for(gi=0;gi<s.grps.length;gi++){ if(state) collapsed[s.grps[gi].c] = 1; else delete collapsed[s.grps[gi].c]; }
        }
      }
    }
    render();
  }
  function act(a){
    var j, it;
    if(a === 'add'){ query = ''; go('cat'); return; }
    if(a === 'smeta' || a === 'rooms'){ go(a); return; }
    if(a === 'filter'){ showFilter = !showFilter; if(!showFilter) filter = ''; render(showFilter ? 'fl' : null); return; }
    if(a === 'expand'){ setAllNodes(0); return; }
    if(a === 'collapse'){ setAllNodes(1); return; }
    if(a === 'del'){
      it = byId(selId); if(!it) return;
      for(j=0;j<doc.items.length;j++) if(doc.items[j].id === selId){ doc.items.splice(j,1); break; }
      selId = null; touch(); say('Строка удалена'); render(); toast('Удалено: ' + it.n);
      return;
    }
    if(a === 'coef'){
      it = byId(selId); if(!it) return;
      dlg('<h3>Коэффициент к позиции</h3>' +
        '<button class="mrow" data-k="1"><span>Без коэффициента<span class="sub">К = 1,00</span></span></button>' +
        '<button class="mrow" data-k="1.15"><span>Стеснённые условия производства работ<span class="sub">К = 1,15</span></span></button>' +
        '<button class="mrow" data-k="1.2"><span>Производство работ в зимнее время<span class="sub">К = 1,20</span></span></button>' +
        '<button class="mrow" data-k="1.35"><span>Работы вблизи действующего оборудования<span class="sub">К = 1,35</span></span></button>' +
        '<button class="mrow" data-k="0.85"><span>Повторное применение<span class="sub">К = 0,85</span></span></button>' +
        '<div class="dact"><button data-x>Отмена</button></div>',
        function(o){
          var b = o.querySelectorAll('[data-k]'), i;
          for(i=0;i<b.length;i++) b[i].addEventListener('click', function(){
            it.k = parseFloat(this.getAttribute('data-k'));
            close(); touch(); render(); toast(it.k === 1 ? 'Коэффициент снят' : 'Применён К ' + num(it.k));
          });
          o.querySelector('[data-x]').addEventListener('click', close);
        });
      return;
    }
    if(a === 'move' || a === 'sect'){
      var move = a === 'move';
      it = move ? byId(selId) : null;
      if(move && !it) return;
      var h = '<h3>' + (move ? 'Перенести в раздел' : 'Разделы сметы') + '</h3>', i, list, sm2;
      for(i=0;i<doc.sects.length;i++){
        list = inSect(doc.sects[i].id);
        sm2 = list.reduce(function(x, y){ return x + sm(y); }, 0);
        h += '<button class="mrow" data-s="' + doc.sects[i].id + '"><span>Раздел ' + (i+1) + '. ' + esc(doc.sects[i].t) +
          '<span class="sub">' + list.length + ' поз. · ' + money(sm2) + ' ₽</span></span>' +
          (doc.sects[i].id === curSect && !move ? '<span class="tag s">текущий</span>' : '') + '</button>';
      }
      h += '<div class="dact"><button data-x>Закрыть</button>' + (move ? '' : '<button class="ok" data-new>Добавить раздел…</button>') + '</div>';
      dlg(h, function(o){
        var b = o.querySelectorAll('[data-s]'), i2;
        for(i2=0;i2<b.length;i2++) b[i2].addEventListener('click', function(){
          var sid = +this.getAttribute('data-s');
          close();
          if(move){ it.sect = sid; curSect = sid; touch(); toast('Перенесено в «' + sectT(sid) + '»'); }
          else curSect = sid;
          render();
        });
        o.querySelector('[data-x]').addEventListener('click', close);
        var nb = o.querySelector('[data-new]');
        if(nb) nb.addEventListener('click', function(){ close(); addSect(); });
      });
    }
  }

  /* ===================== привязка ===================== */
  function bind(){
    var i, els;
    els = body.querySelectorAll('.ed');
    for(i=0;i<els.length;i++) els[i].addEventListener('click', function(e){ e.stopPropagation(); editCell(this); });
    els = body.querySelectorAll('tr.d[data-row]');
    for(i=0;i<els.length;i++) els[i].addEventListener('click', function(){
      selId = +this.getAttribute('data-row');
      var it = byId(selId); if(it) curSect = it.sect;
      render();
    });
    els = body.querySelectorAll('tr.b1[data-sect]');
    for(i=0;i<els.length;i++) els[i].addEventListener('click', function(){
      curSect = +this.getAttribute('data-sect'); render();
    });
    els = body.querySelectorAll('[data-node]');
    for(i=0;i<els.length;i++) els[i].addEventListener('click', function(){
      var k = this.getAttribute('data-node');
      if(collapsed[k]) delete collapsed[k]; else collapsed[k] = 1;
      render();
    });
    els = body.querySelectorAll('[data-res]');
    for(i=0;i<els.length;i++) els[i].addEventListener('click', function(){ insertRes(this.getAttribute('data-res')); });
    var itg = document.getElementById('itg');
    if(itg) itg.addEventListener('click', function(){ VIEW.itogi = false; render(); });

    els = body.querySelectorAll('[data-doc]');
    for(i=0;i<els.length;i++) els[i].addEventListener('click', function(){
      var id = this.getAttribute('data-doc'), j;
      for(j=0;j<DOCS.length;j++) if(DOCS[j].id === id) doc = DOCS[j];
      selId = null; filter = ''; showFilter = false;
      curSect = doc.sects.length ? doc.sects[0].id : 0;
      say('Открыто: ' + doc.code); go('smeta');
    });
    var nd = document.getElementById('newDoc'); if(nd) nd.addEventListener('click', newDoc);

    els = body.querySelectorAll('[data-room]');
    for(i=0;i<els.length;i++) els[i].addEventListener('click', function(){ roomId = +this.getAttribute('data-room'); go('room'); });
    var nr = document.getElementById('newRoom');
    if(nr) nr.addEventListener('click', function(){
      ask('Добавить помещение', 'Наименование', '', function(v){
        var r = {id:++uid, name:v, l:4, w:3, h:2.7, op:2};
        doc.rooms.push(r); roomId = r.id; go('room');
      });
    });
    var dl = document.getElementById('delRoom');
    if(dl) dl.addEventListener('click', function(){
      for(var j=0;j<doc.rooms.length;j++) if(doc.rooms[j].id === roomId){ doc.rooms.splice(j,1); break; }
      go('rooms'); toast('Помещение удалено');
    });
    ['rn','rl','rw','rh','ro'].forEach(function(id){
      var el = document.getElementById(id); if(!el) return;
      el.addEventListener('input', function(){
        var r = null, j;
        for(j=0;j<doc.rooms.length;j++) if(doc.rooms[j].id === roomId) r = doc.rooms[j];
        if(!r) return;
        if(id === 'rn'){ r.name = this.value; return; }
        r[{rl:'l', rw:'w', rh:'h', ro:'op'}[id]] = pnum(this.value);
        var p = this.selectionStart; render(id);
        var again = document.getElementById(id);
        if(again) try{ again.setSelectionRange(p, p); }catch(e){}
      });
    });
    els = body.querySelectorAll('[data-take]');
    for(i=0;i<els.length;i++) els[i].addEventListener('click', function(){
      pending = Math.round(pnum(this.getAttribute('data-take')) * 100) / 100;
      query = ''; go('cat'); toast('Объём ' + num(pending) + ' будет подставлен в «Кол-во»');
    });

    els = body.querySelectorAll('[data-fmt]');
    for(i=0;i<els.length;i++) els[i].addEventListener('click', function(){ expFmt = this.getAttribute('data-fmt'); render(); });
    var exp = document.getElementById('expBtn');
    if(exp) exp.addEventListener('click', function(){
      var bar = document.getElementById('bar'), res = document.getElementById('expRes'), p = 0;
      exp.disabled = true; res.innerHTML = ''; say('Формирование файла…');
      var iv = setInterval(function(){
        p += 25; bar.style.width = Math.min(p, 100) + '%';
        if(p >= 100){
          clearInterval(iv); doc.changes = 0; exp.disabled = false;
          res.innerHTML = '<div class="panel" style="margin-top:11px"><h4>Файл сформирован</h4>' +
            '<div class="cl"><span>smeta_' + esc(doc.code.toLowerCase()) + '.' + expFmt + '</span><span class="tag o">148 КБ</span></div>' +
            '<div class="cl"><span>Передать на компьютер</span><button>Отправить</button></div></div>';
          say('Файл сформирован на устройстве'); toast('Файл готов — сеть не потребовалась'); render();
        }
      }, 170);
    });

    [['pName','name'],['pCode','code'],['pAddr','addr'],['pCust','cust'],['pDate','date']].forEach(function(pr){
      var el = document.getElementById(pr[0]); if(!el) return;
      el.addEventListener('input', function(){ doc[pr[1]] = this.value; touch(); head(); });
    });
    els = body.querySelectorAll('[data-ren]');
    for(i=0;i<els.length;i++) els[i].addEventListener('click', function(){
      var sid = +this.getAttribute('data-ren'), sc = null, j;
      for(j=0;j<doc.sects.length;j++) if(doc.sects[j].id === sid) sc = doc.sects[j];
      ask('Наименование раздела', 'Наименование', sc.t, function(v){ sc.t = v; touch(); render(); });
    });
    var as = document.getElementById('addSect'); if(as) as.addEventListener('click', addSect);

    [['cNr','nr'],['cSp','sp'],['cNds','nds']].forEach(function(pr){
      var el = document.getElementById(pr[0]); if(!el) return;
      el.addEventListener('input', function(){
        CFG[pr[1]] = pnum(this.value);
        var p = this.selectionStart; render(pr[0]);
        var again = document.getElementById(pr[0]);
        if(again) try{ again.setSelectionRange(p, p); }catch(e){}
      });
    });

    var q = document.getElementById('q');
    if(q) q.addEventListener('input', function(){ query = this.value; render('q'); });
    var fl = document.getElementById('fl');
    if(fl) fl.addEventListener('input', function(){ filter = this.value; render('fl'); });
    var fx = document.getElementById('flX');
    if(fx) fx.addEventListener('click', function(){ filter = ''; showFilter = false; render(); });

    els = subtabs.querySelectorAll('[data-ct]');
    for(i=0;i<els.length;i++) els[i].addEventListener('click', function(){
      catKey = this.getAttribute('data-ct'); query = ''; body.scrollTop = 0; render();
    });
    els = toolbar.querySelectorAll('[data-a]');
    for(i=0;i<els.length;i++) els[i].addEventListener('click', function(){ act(this.getAttribute('data-a')); });
  }

  /* ===================== запуск ===================== */
  (function(){
    var h = '', i;
    for(i=0;i<MENUS.length;i++) h += '<button data-m="' + i + '">' + esc(MENUS[i].t) + '</button>';
    menubar.innerHTML = h;
    var b = menubar.querySelectorAll('[data-m]');
    for(i=0;i<b.length;i++) b[i].addEventListener('click', function(){ openMenu(+this.getAttribute('data-m')); });
  })();
  var tb = tabs.children;
  for(var z=0; z<tb.length; z++) tb[z].addEventListener('click', function(){ go(this.getAttribute('data-tab')); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });
  render();
})();
</script>
